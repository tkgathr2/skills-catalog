  .card{

  {n:"code-review", a:"コードレビュー", cat:"builtin", scope:"auto", d:"差分のバグ・簡素化を指定レベルでレビュー。ultraでクラウド多agent。", t:["/code-review","コードレビュー","差分をレビュー","ultrareview"]},
  {n:"simplify", a:"簡素化", cat:"builtin", scope:"auto", d:"変更コードの再利用・簡素化・効率化を適用（品質のみ）。", t:["/simplify","簡素化して","シンプルにして"]},
  {n:"security-review", a:"セキュリティレビュー", cat:"builtin", scope:"auto", d:"セキュリティ脆弱性の検出。", t:["security review","セキュリティを見て","脆弱性チェック"]},
  {n:"run", a:"実行（アプリ起動）", cat:"builtin", scope:"auto", d:"このプロジェクトのアプリを起動して変更を確認。", t:["/run","アプリを起動","動かして見せて"]},
  {n:"init", a:"初期化", cat:"builtin", scope:"auto", d:"プロジェクトの初期化。", t:["/init","初期化"]},
  {n:"review", a:"レビュー", cat:"builtin", scope:"auto", d:"汎用レビュー。", t:["/review","レビューして"]},
  {n:"loop", a:"ループ実行", cat:"builtin", scope:"auto", d:"プロンプト/コマンドを定期間隔で繰り返し実行。", t:["/loop","定期的に実行","○分ごとに"]},
  {n:"claude-api", a:"Claude APIリファレンス", cat:"builtin", scope:"auto", d:"Claude API/SDKの仕様・モデルID・料金リファレンス。", t:["Claude API","Anthropic SDK","モデルID","Claudeの料金"]},
  {n:"deep-research-builtin", a:"deep-research(builtin)", cat:"builtin", scope:"auto", d:"組み込みのディープリサーチハーネス。", t:["deep research","多ソース調査"]},
  {n:"update-config", a:"設定変更", cat:"builtin", scope:"auto", d:"settings.jsonの設定・権限・hook・環境変数を変更。", t:["設定を変えて","permissionを追加","hookを設定","これからは○○のたびに"]},
  {n:"keybindings-help", a:"キーバインド設定", cat:"builtin", scope:"auto", d:"キーボードショートカットのカスタマイズ。", t:["キーバインド","ショートカットを変更","rebind"]},
  {n:"fewer-permission-prompts", a:"許可確認削減", cat:"builtin", scope:"auto", d:"頻出の読み取り系コマンドを許可リスト化し確認を減らす。", t:["許可を減らして","確認を減らす","permission prompts"]},
  {n:"schedule-builtin", a:"スケジュール（クラウド）", cat:"builtin", scope:"auto", d:"cronで動くクラウドエージェント（ルーチン）を作成・管理。", t:["定期実行を作って","cronで","スケジュールエージェント"]},
];

// スキルが対象PCにあるか（pc未指定＝3台共通）
function skillPcs(s){ return s.pc && s.pc.length ? s.pc : ALL_PC; }
function onPc(s, pc){ return pc==='all' || skillPcs(s).includes(pc); }

// ---- 要素 ----
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const stats = document.getElementById('stats');
const crumb = document.getElementById('crumb');
const pcListEl = document.getElementById('pcList');
const navListEl = document.getElementById('navList');
const scopeChipsEl = document.getElementById('scopeChips');
const searchEl = document.getElementById('search');
const builtEl = document.getElementById('built');
let activePc = 'all';
let activeCat = 'all';
let activeScope = 'all';

// ---- 生成時刻 ----
builtEl.innerHTML = `作成：<b>${BUILT}</b><br>全 <b>${SKILLS.length}</b> スキル収録`;

// ---- PCセレクタ ----
function buildPcList(){
  pcListEl.innerHTML='';
  ['all','home','note','office'].forEach(pc=>{
    const p=PCS[pc];
    const cnt = SKILLS.filter(s=>onPc(s,pc)).length;
    const b=document.createElement('button');
    b.className='pc-btn'+(pc===activePc?' active':'');
    b.dataset.pc=pc;
    b.innerHTML=`<span class="ico">${p.ico}</span><span>${p.label}</span><span class="cnt">${cnt}</span>`;
    b.onclick=()=>{activePc=pc;buildPcList();buildNav();render();closeDrawer();};
    pcListEl.appendChild(b);
  });
}

// ---- カテゴリナビ ----
function buildNav(){
  navListEl.innerHTML='';
  const pcSkills = SKILLS.filter(s=>onPc(s,activePc));
  const allItem=mkNav('all','📋','すべて',pcSkills.length);
  navListEl.appendChild(allItem);
  Object.keys(CATS).forEach(k=>{
    const cnt=pcSkills.filter(s=>s.cat===k).length;
    if(cnt===0) return;
    navListEl.appendChild(mkNav(k,CATS[k].ico,CATS[k].label,cnt));
  });
}
function mkNav(key,ico,label,cnt){
  const it=document.createElement('button');
  it.className='nav-item'+(key===activeCat?' active':'');
  it.dataset.cat=key;
  it.innerHTML=`<span class="ico">${ico}</span><span class="lbl">${label}</span><span class="cnt">${cnt}</span>`;
  it.onclick=()=>{activeCat=key;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.cat===key));render();closeDrawer();};
  return it;
}

// ---- 権限チップ ----
[['all','全権限'],['auto','🟢 自動実行'],['pres','🟡 社長確認']].forEach(([k,l])=>{
  const c=document.createElement('div');
  c.className='chip'+(k==='all'?' active':'');
  c.textContent=l;c.dataset.scope=k;
  c.onclick=()=>{activeScope=k;document.querySelectorAll('.chip[data-scope]').forEach(x=>x.classList.toggle('active',x.dataset.scope===k));render();};
  scopeChipsEl.appendChild(c);
});

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function pcBadge(s){
  const pcs=skillPcs(s);
  if(pcs.length>=3) return '';
  const names=pcs.map(p=>PCS[p].ico+PCS[p].short).join('・');
  return `<span class="pcbadge">${names}のみ</span>`;
}

function render(){
  const q=searchEl.value.trim();
  const ql=q.toLowerCase();
  const list=SKILLS.filter(s=>{
    if(!onPc(s,activePc)) return false;
    if(activeCat!=='all'&&s.cat!==activeCat) return false;
    if(activeScope!=='all'&&s.scope!==activeScope) return false;
    if(!q) return true;
    return s.n.toLowerCase().includes(ql)
      || s.a.toLowerCase().includes(ql)
      || s.d.toLowerCase().includes(ql)
      || s.t.some(x=>x.toLowerCase().includes(ql));
  });
  grid.innerHTML='';
  empty.style.display=list.length?'none':'block';
  list.forEach(s=>{
    const card=document.createElement('div');card.className='card';
    const trigHtml=s.t.map(x=>`<span class="trig">${hl(x,q)}</span>`).join('');
    card.innerHTML=`
      <div class="card-top">
        <div>
          <div class="card-name">${hl(s.a,q)}</div>
          <div class="card-alias">${hl(s.n,q)}</div>
        </div>
        <div class="badges">
          <span class="scope ${s.scope}">${s.scope==='auto'?'🟢 自動':'🟡 確認'}</span>
          ${pcBadge(s)}
        </div>
      </div>
      <div class="card-cat">${catLabel(s.cat)}</div>
      <div class="card-desc">${hl(s.d,q)}</div>
      <div class="triggers"><span class="trig-label">▶ 発動の言葉</span>${trigHtml}</div>
    `;
    grid.appendChild(card);
  });
  stats.textContent=`${list.length} 件を表示`+(q?`（「${q}」で検索）`:'');
  // パンくず
  const pcTxt = activePc==='all' ? '全PC共通' : (PCS[activePc].ico+' '+PCS[activePc].label);
  const catTxt = activeCat==='all' ? 'すべて' : catLabel(activeCat);
  crumb.innerHTML=`<b>${pcTxt}</b> ／ ${catTxt}`;
}

searchEl.addEventListener('input',render);

// ---- テーマ ----
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.textContent=t==='light'?'☀️ ライトモード':'🌙 ダークモード';
  try{localStorage.setItem('skill-catalog-theme',t);}catch(e){}
}
themeBtn.onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
let saved='dark'; try{saved=localStorage.getItem('skill-catalog-theme')||'dark';}catch(e){}
setTheme(saved);

// ---- モバイル ドロワー ----
const sidebar=document.getElementById('sidebar');
const backdrop=document.getElementById('backdrop');
document.getElementById('hamburger').onclick=()=>{sidebar.classList.add('open');backdrop.classList.add('show');};
function closeDrawer(){sidebar.classList.remove('open');backdrop.classList.remove('show');}
backdrop.onclick=closeDrawer;

// ---- 初期描画 ----
buildPcList();
buildNav();
render();
</script>
</body>
</html>
